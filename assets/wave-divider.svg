<svg xmlns="http://www.w3.org/2000/svg" width="900" height="28" viewBox="0 0 900 28" role="img" aria-label="divider">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="20%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#58a6ff"/>
      <stop offset="80%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="40" y="12" width="820" height="2" rx="1" fill="url(#g)"/>
  <circle cx="450" cy="13" r="3.5" fill="#2dd4bf">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/>
  </circle>
</svg>
